name: Build Persian AI Dubber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==================================================
      # Checkout
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ==================================================
      # Python
      # ==================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==================================================
      # Java
      # ==================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

      # ==================================================
      # System dependencies
      # ==================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      # ==================================================
      # Verify FFmpeg
      # ==================================================

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -e

          echo "Checking native/bin/ffmpeg..."

          if [ ! -f "native/bin/ffmpeg" ]; then
            echo "ERROR: native/bin/ffmpeg not found."
            exit 1
          fi

          echo "FFmpeg file found."

          ls -lh native/bin/ffmpeg

          file native/bin/ffmpeg || true

          chmod +x native/bin/ffmpeg

          echo "FFmpeg permissions:"
          ls -l native/bin/ffmpeg

      # ==================================================
      # Install Buildozer
      # ==================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          pip install \
            buildozer \
            cython==0.29.36

      # ==================================================
      # Download official whisper.cpp
      # ==================================================

      - name: Download whisper.cpp
        shell: bash
        run: |
          set -e

          rm -rf native/whisper.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/whisper.cpp.git \
            native/whisper.cpp

          test -f native/whisper.cpp/CMakeLists.txt

          echo "whisper.cpp downloaded successfully."

      # ==================================================
      # Install Android SDK / NDK
      # ==================================================

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      # ==================================================
      # Build Whisper + DubaAI native wrapper
      # ==================================================

      - name: Build DubaAI Whisper Native Engine
        shell: bash
        run: |
          set -e

          NATIVE_DIR="$GITHUB_WORKSPACE/native"
          BUILD_DIR="$NATIVE_DIR/build-android-arm64"

          rm -rf "$BUILD_DIR"

          mkdir -p \
            "$BUILD_DIR" \
            "$GITHUB_WORKSPACE/native/libs/arm64-v8a"

          cmake \
            -S "$NATIVE_DIR" \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_CURL=OFF \
            -DWHISPER_SDL2=OFF \
            -DWHISPER_COMMON_FFMPEG=OFF \
            -DGGML_NATIVE=OFF

          cmake \
            --build "$BUILD_DIR" \
            --target dubaai_whisper \
            --parallel 2

          echo ""
          echo "========================================"
          echo "Native build completed"
          echo "========================================"

          find "$BUILD_DIR" \
            -type f \
            -name "*.so" \
            -print

      # ==================================================
      # Prepare Android Native Libraries
      # ==================================================

      - name: Prepare Android Native Libraries
        shell: bash
        run: |
          set -e

          DEST="$GITHUB_WORKSPACE/native/libs/arm64-v8a"

          rm -f "$DEST"/*.so

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libdubaai_whisper.so" \
            -exec cp {} "$DEST/" \;

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libwhisper.so" \
            -exec cp {} "$DEST/" \; || true

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libggml.so" \
            -exec cp {} "$DEST/" \; || true

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libggml-base.so" \
            -exec cp {} "$DEST/" \; || true

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libggml-cpu.so" \
            -exec cp {} "$DEST/" \; || true

          echo ""
          echo "========================================"
          echo "APK native libraries"
          echo "========================================"

          find "$DEST" \
            -type f \
            -name "*.so" \
            -print

          if [ ! -f "$DEST/libdubaai_whisper.so" ]; then
            echo "ERROR: libdubaai_whisper.so was not created."
            exit 1
          fi

      # ==================================================
      # Verify project structure
      # ==================================================

      - name: Verify Project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          echo ""
          echo "--- native/bin ---"
          ls -lh native/bin/ || true

          echo ""
          echo "--- native/libs/arm64-v8a ---"
          ls -lh native/libs/arm64-v8a/ || true

          echo ""
          echo "--- engine ---"
          find engine -maxdepth 1 -type f -print

          echo ""
          echo "--- Buildozer configuration ---"

          grep -E \
            "title|package.name|requirements|android.archs|android.add_libs|source.include_exts" \
            buildozer.spec

      # ==================================================
      # Build APK
      # ==================================================

      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting DubaAI Android APK build"
          echo "========================================"

          buildozer android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "Buildozer exit code: $BUILD_EXIT"

          exit $BUILD_EXIT

      # ==================================================
      # Verify APK
      # ==================================================

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "APK FILES"
          echo "========================================"

          find bin \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK successfully created."

      # ==================================================
      # Upload Build Log
      # ==================================================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Build-Log
          path: |
            build.log
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/dists/*/build.gradle
          if-no-files-found: warn

      # ==================================================
      # Upload Native Engine
      # ==================================================

      - name: Upload DubaAI Native Engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Whisper-ARM64
          path: |
            native/libs/arm64-v8a/*.so
          if-no-files-found: warn

      # ==================================================
      # Upload FFmpeg
      # ==================================================

      - name: Upload FFmpeg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-FFmpeg-ARM64
          path: |
            native/bin/ffmpeg
          if-no-files-found: error

      # ==================================================
      # Upload APK
      # ==================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Persian-AI-Dubber-APK
          path: bin/*.apk
          if-no-files-found: error
