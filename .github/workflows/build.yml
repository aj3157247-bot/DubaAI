name: Build Persian AI Dubber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ==============================================
      # 1. CHECKOUT
      # ==============================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==============================================
      # 2. PYTHON
      # ==============================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==============================================
      # 3. JAVA 17
      # ==============================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==============================================
      # 4. SYSTEM DEPENDENCIES
      # ==============================================

      - name: Install system dependencies
        shell: bash
        run: |

          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            cmake \
            ninja-build \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zip \
            unzip \
            wget \
            curl \
            zlib1g-dev \
            libffi-dev \
            libssl-dev

      # ==============================================
      # 5. CHECK PROJECT
      # ==============================================

      - name: Verify project structure
        shell: bash
        run: |

          set -e

          echo "========== PROJECT =========="

          test -f main.py
          test -f buildozer.spec

          test -d engine
          test -d native

          test -f native/CMakeLists.txt
          test -f native/dubaai_whisper.cpp

          echo ""
          echo "Project structure OK."

      # ==============================================
      # 6. DOWNLOAD WHISPER.CPP
      # ==============================================

      - name: Download whisper.cpp
        shell: bash
        run: |

          set -e

          rm -rf native/whisper.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/whisper.cpp.git \
            native/whisper.cpp

          test -f native/whisper.cpp/CMakeLists.txt

          echo ""
          echo "whisper.cpp downloaded successfully."

      # ==============================================
      # 7. ANDROID SDK / NDK
      # ==============================================

      - name: Install Android SDK and NDK
        shell: bash
        run: |

          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo \
            "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" \
            >> "$GITHUB_ENV"

          echo ""
          echo "Android SDK/NDK installed."

      # ==============================================
      # 8. BUILD NATIVE WHISPER
      # ==============================================

      - name: Build DubaAI Whisper native library
        shell: bash
        run: |

          set -e

          NATIVE="$GITHUB_WORKSPACE/native"
          BUILD="$NATIVE/build-android-arm64"

          rm -rf "$BUILD"

          mkdir -p \
            "$BUILD" \
            "$NATIVE/libs/arm64-v8a"

          cmake \
            -S "$NATIVE" \
            -B "$BUILD" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_CURL=OFF \
            -DWHISPER_SDL2=OFF \
            -DWHISPER_COMMON_FFMPEG=OFF \
            -DGGML_NATIVE=OFF

          cmake \
            --build "$BUILD" \
            --target dubaai_whisper \
            --parallel 2

          echo ""
          echo "========== NATIVE LIBRARIES =========="

          find "$BUILD" \
            -type f \
            -name "*.so" \
            -print

      # ==============================================
      # 9. COPY NATIVE LIBRARIES
      # ==============================================

      - name: Prepare native libraries
        shell: bash
        run: |

          set -e

          DEST="$GITHUB_WORKSPACE/native/libs/arm64-v8a"

          rm -f "$DEST"/*.so

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libdubaai_whisper.so" \
            -exec cp {} "$DEST/" \;

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libwhisper.so" \
            -exec cp {} "$DEST/" \; || true

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libggml.so" \
            -exec cp {} "$DEST/" \; || true

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libggml-base.so" \
            -exec cp {} "$DEST/" \; || true

          find "$GITHUB_WORKSPACE/native/build-android-arm64" \
            -type f \
            -name "libggml-cpu.so" \
            -exec cp {} "$DEST/" \; || true

          echo ""
          echo "========== APK NATIVE LIBRARIES =========="

          find "$DEST" \
            -type f \
            -name "*.so" \
            -print

          test -f "$DEST/libdubaai_whisper.so"

          echo ""
          echo "Native engine is ready."

      # ==============================================
      # 10. INSTALL BUILDOZER
      # ==============================================

      - name: Install Buildozer
        shell: bash
        run: |

          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          pip install \
            buildozer \
            cython==0.29.36

          buildozer --version

      # ==============================================
      # 11. VERIFY BUILDOZER SPEC
      # ==============================================

      - name: Verify Buildozer configuration
        shell: bash
        run: |

          set -e

          echo "========== PYTHON =========="

          python --version

          echo ""
          echo "========== JAVA =========="

          java -version

          echo ""
          echo "========== BUILDOZER =========="

          buildozer --version

          echo ""
          echo "========== SPEC =========="

          grep -E \
            "title|package.name|package.domain|requirements|android.api|android.minapi|android.ndk|android.archs|android.add_libs" \
            buildozer.spec

          echo ""
          echo "========== NATIVE =========="

          find native/libs \
            -type f \
            -name "*.so" \
            -print

      # ==============================================
      # 12. BUILD APK
      # ==============================================

      - name: Build APK
        id: build_apk
        shell: bash
        run: |

          set -o pipefail

          echo ""
          echo "========================================"
          echo "Starting DubaAI APK build"
          echo "========================================"

          buildozer android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "Buildozer exit code: $BUILD_EXIT"

          exit "$BUILD_EXIT"

      # ==============================================
      # 13. SHOW APK
      # ==============================================

      - name: Find generated APK
        if: success()
        shell: bash
        run: |

          set -e

          echo "========== GENERATED APK =========="

          find bin \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find bin -type f -name '*.apk' -print -quit)"

      # ==============================================
      # 14. UPLOAD APK
      # ==============================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Persian-AI-Dubber-APK
          path: bin/*.apk
          if-no-files-found: error

      # ==============================================
      # 15. UPLOAD BUILD LOG
      # ==============================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Build-Log
          path: |
            build.log
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: warn

      # ==============================================
      # 16. UPLOAD NATIVE ENGINE
      # ==============================================

      - name: Upload native engine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Whisper-ARM64
          path: |
            native/libs/arm64-v8a/*.so
          if-no-files-found: warn
