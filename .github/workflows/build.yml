name: Build Persian AI Dubber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          pip install \
            buildozer \
            cython==0.29.36

      # ==================================================
      # Download official whisper.cpp
      # ==================================================

      - name: Download whisper.cpp
        shell: bash
        run: |
          set -e

          rm -rf native/whisper.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/whisper.cpp.git \
            native/whisper.cpp

          echo "whisper.cpp downloaded."

          test -f native/whisper.cpp/CMakeLists.txt

      # ==================================================
      # Android SDK / NDK
      # ==================================================

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"

          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

          test -d "$ANDROID_NDK_HOME"

      # ==================================================
      # Build official Whisper shared libraries
      # ==================================================

      - name: Build Whisper ARM64
        shell: bash
        run: |
          set -e

          WHISPER_DIR="$GITHUB_WORKSPACE/native/whisper.cpp"
          BUILD_DIR="$WHISPER_DIR/build-android-arm64"

          rm -rf "$BUILD_DIR"

          cmake \
            -S "$WHISPER_DIR" \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_SDL2=OFF \
            -DWHISPER_CURL=OFF \
            -DGGML_NATIVE=OFF

          cmake \
            --build "$BUILD_DIR" \
            --config Release \
            --parallel 2

          echo ""
          echo "========== WHISPER LIBRARIES =========="

          find "$BUILD_DIR" \
            -type f \
            \( \
              -name "libwhisper.so" \
              -o -name "libggml.so" \
              -o -name "libggml-base.so" \
              -o -name "libggml-cpu.so" \
            \) \
            -print

      # ==================================================
      # Verify native libraries
      # ==================================================

      - name: Verify Whisper libraries
        shell: bash
        run: |
          set -e

          WHISPER_DIR="$GITHUB_WORKSPACE/native/whisper.cpp"
          BUILD_DIR="$WHISPER_DIR/build-android-arm64"

          echo "Searching for native libraries..."

          find "$BUILD_DIR" \
            -type f \
            -name "*.so" \
            -print

          WHISPER_LIB=$(find "$BUILD_DIR" \
            -type f \
            -name "libwhisper.so" \
            | head -n 1)

          if [ -z "$WHISPER_LIB" ]; then
            echo "ERROR: libwhisper.so was not produced."
            exit 1
          fi

          echo "Whisper library found:"
          echo "$WHISPER_LIB"

      # ==================================================
      # Prepare native libraries for later APK integration
      # ==================================================

      - name: Prepare Whisper ARM64 libraries
        shell: bash
        run: |
          set -e

          mkdir -p native/libs/arm64-v8a

          BUILD_DIR="$GITHUB_WORKSPACE/native/whisper.cpp/build-android-arm64"

          find "$BUILD_DIR" \
            -type f \
            -name "libwhisper.so" \
            -exec cp {} native/libs/arm64-v8a/ \;

          find "$BUILD_DIR" \
            -type f \
            -name "libggml.so" \
            -exec cp {} native/libs/arm64-v8a/ \; \
            || true

          find "$BUILD_DIR" \
            -type f \
            -name "libggml-base.so" \
            -exec cp {} native/libs/arm64-v8a/ \; \
            || true

          find "$BUILD_DIR" \
            -type f \
            -name "libggml-cpu.so" \
            -exec cp {} native/libs/arm64-v8a/ \; \
            || true

          echo ""
          echo "========== PREPARED LIBRARIES =========="

          find native/libs \
            -type f \
            -print

      # ==================================================
      # Build DubaAI APK
      # ==================================================

      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting DubaAI Android APK build"
          echo "========================================"

          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Building APK..."

          buildozer android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "Buildozer exit code: $BUILD_EXIT"

          exit $BUILD_EXIT

      # ==================================================
      # Upload Build Log
      # ==================================================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Build-Log
          path: |
            build.log
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/dists/*/build.gradle
          if-no-files-found: warn

      # ==================================================
      # Upload Whisper ARM64 build
      # ==================================================

      - name: Upload Whisper ARM64
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Whisper-ARM64
          path: |
            native/libs/arm64-v8a/*.so
            native/whisper.cpp/build-android-arm64/**/*.so
          if-no-files-found: warn

      # ==================================================
      # Upload APK
      # ==================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Persian-AI-Dubber-APK
          path: bin/*.apk
          if-no-files-found: error
