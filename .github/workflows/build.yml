name: Build Persian AI Dubber

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fix Ubuntu package mirrors
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo sed -i 's|http://security.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          sudo apt-get clean
          sudo apt-get update

      - name: Install FFmpeg
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Python dependencies
        run: |
          pip install --prefer-binary -r requirements.txt

      - name: Check FFmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Check Python
        run: |
          python --version
          python -m py_compile main.py

      - name: Prepare release
        run: |
          mkdir -p release
          cp main.py release/
          cp requirements.txt release/
          cp buildozer.spec release/ 2>/dev/null || true

      - name: Upload project
        uses: actions/upload-artifact@v4
        with:
          name: Persian-AI-Dubber
          path: release/
