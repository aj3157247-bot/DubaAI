name: Build Persian AI Dubber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          java -version
          javac -version

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            ninja-build \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      # --------------------------------------------------
      # Download whisper.cpp
      # --------------------------------------------------

      - name: Download whisper.cpp
        run: |
          set -e

          rm -rf native/whisper.cpp

          git clone \
            --depth 1 \
            https://github.com/ggml-org/whisper.cpp.git \
            native/whisper.cpp

          echo "whisper.cpp downloaded."

          ls -la native/whisper.cpp

      # --------------------------------------------------
      # Prepare Android NDK
      # --------------------------------------------------

      - name: Install Android NDK
        run: |
          set -e

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # --------------------------------------------------
      # Build Whisper for ARM64
      # --------------------------------------------------

      - name: Build Whisper ARM64
        shell: bash
        run: |
          set -e

          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"

          WHISPER_DIR="$GITHUB_WORKSPACE/native/whisper.cpp"
          BUILD_DIR="$WHISPER_DIR/build-android-arm64"

          rm -rf "$BUILD_DIR"

          cmake \
            -S "$WHISPER_DIR" \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DGGML_NATIVE=OFF

          cmake \
            --build "$BUILD_DIR" \
            --config Release \
            --parallel 2

          echo "======================================"
          echo "Whisper ARM64 build completed"
          echo "======================================"

          find "$BUILD_DIR" \
            -type f \
            \( -name "*.so" -o -name "whisper-cli" \) \
            -print

      # --------------------------------------------------
      # Build DubaAI APK
      # --------------------------------------------------

      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting DubaAI Android APK build"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          buildozer android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "Buildozer exit code: $BUILD_EXIT"

          exit $BUILD_EXIT

      # --------------------------------------------------
      # Upload Build Log
      # --------------------------------------------------

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Build-Log
          path: |
            build.log
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/dists/*/build.gradle
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload Whisper Build
      # --------------------------------------------------

      - name: Upload Whisper Native Build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Whisper-ARM64
          path: |
            native/whisper.cpp/build-android-arm64/**/*.so
            native/whisper.cpp/build-android-arm64/**/whisper-cli
          if-no-files-found: warn

      # --------------------------------------------------
      # Upload APK
      # --------------------------------------------------

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Persian-AI-Dubber-APK
          path: bin/*.apk
          if-no-files-found: error
