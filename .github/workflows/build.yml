name: Build Persian AI Dubber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-22.04

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ==================================================
      # PYTHON
      # ==================================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==================================================
      # JAVA
      # ==================================================

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "JAVA"
          echo "========================================"
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version


      # ==================================================
      # SYSTEM DEPENDENCIES
      # ==================================================

      - name: Install system dependencies
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libffi-dev \
            libssl-dev


      # ==================================================
      # INSTALL BUILDOZER
      # ==================================================

      - name: Install Buildozer
        shell: bash
        run: |
          set -e
          pip install --upgrade pip
          pip install buildozer cython==0.29.36
          echo "Buildozer installed."
          buildozer --version


      # ==================================================
      # BUILD APK
      # ==================================================

      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail
          echo "========================================"
          echo "STARTING DubaAI APK BUILD"
          echo "========================================"
          buildozer android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          echo "Buildozer exit code: $BUILD_EXIT"
          exit $BUILD_EXIT


      # ==================================================
      # VERIFY APK
      # ==================================================

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          set -e
          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"
          find bin -type f -name "*.apk" -exec ls -lh {} \;
          APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi
          echo "APK successfully created."


      # ==================================================
      # UPLOAD BUILD LOG
      # ==================================================

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Build-Log
          path: |
            build.log
            .buildozer/android/platform/build-*/build.log
          if-no-files-found: warn


      # ==================================================
      # UPLOAD APK
      # ==================================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Persian-AI-Dubber-APK
          path: bin/*.apk
          if-no-files-found: error
