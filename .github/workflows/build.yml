name: Build Persian AI Dubber APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java 17
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

          JAVA_MAJOR=$(java -version 2>&1 | sed -n 's/.*version "\(17\).*/\1/p')

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "ERROR: Java 17 is not active!"
            exit 1
          fi

          echo "Java 17 is active and ready."

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Verify Build Environment
        shell: bash
        run: |
          set -e

          echo "========== PYTHON =========="
          python --version

          echo "========== JAVA =========="
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          echo "========== BUILDOZER =========="
          buildozer --version

          echo "========== ENVIRONMENT CHECK =========="

          if [ ! -x "$JAVA_HOME/bin/java" ]; then
            echo "ERROR: Java executable not found!"
            exit 1
          fi

          echo "Environment OK."

      - name: Build APK
        id: build_apk
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "Starting DubaAI Android APK build"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"
          java -version

          buildozer android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo "Buildozer exit code: $BUILD_EXIT"

          exit $BUILD_EXIT

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DubaAI-Build-Log
          path: |
            build.log
            .buildozer/android/platform/build-*/build.log
            .buildozer/android/platform/build-*/dists/*/build.gradle
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Persian-AI-Dubber-APK
          path: bin/*.apk
          if-no-files-found: error
